
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Manipulation Practice</title>

    <style>
        .highlight {
            color: blue;
            background-color: lightyellow;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Basic DOM Elements -->
    <h1 id="title">Hello Zain, I am learning JavaScript</h1>
    <h2 id="age">My age is 20</h2>

    <!-- Paragraph Selection -->
    <section id="paragraphs">
        <p class="p">One</p>
        <p class="p">Two</p>
        <p class="p">Three</p>
    </section>

    <!-- Dynamic HTML Content -->
    <div id="box"></div>

    <!-- Class Toggle Practice -->
    <section id="theme-section">
        <h2 id="heading">Hello World</h2>
        <button id="toggleBtn" type="button">
            Change Theme
        </button>
    </section>

    <!-- Element Creation Practice -->
    <div id="container"></div>

    <!-- Attribute Practice -->
    <button id="submitBtn" type="button" disabled>
        Submit
    </button>

    <script src="script.js"></script>
</body>
</html>
